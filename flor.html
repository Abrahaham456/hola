<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Para Ti - Te Amo</title>
	<style>
		:root {
			color-scheme: dark;
			--night: #05030b;
			--violet: #24103b;
			--yellow: #ffff00;
		}

		* { box-sizing: border-box; }

		html, body {
			width: 100%;
			min-height: 100%;
			margin: 0;
		}

		body {
			min-height: 100vh;
			overflow: hidden;
			background: var(--night);
			font-family: Georgia, serif;
		}

		.escena {
			display: block;
			width: 100vw;
			height: 100vh;
		}

		svg {
			display: block;
			width: 100%;
			height: 100%;
		}

		.titulo {
			fill: var(--yellow);
			font-family: "Segoe Print", "Bradley Hand", cursive;
			font-size: 46px;
			font-weight: 700;
			letter-spacing: .5px;
			paint-order: stroke;
			stroke: rgba(45, 14, 48, .75);
			stroke-width: 3px;
			filter: url(#brillo);
		}

		.estrella { fill: #fff; }

		.flor {
			animation: respirar 5s ease-in-out infinite;
		}

		.flor:nth-of-type(2n) { animation-delay: -1.6s; }
		.flor:nth-of-type(3n) { animation-delay: -3s; }

		.petalo { fill: url(#degradadoPetalo); }
		.centro { fill: url(#degradadoCentro); stroke: #160c05; stroke-width: 5; }
		.semilla { fill: #9b6423; opacity: .82; }

		.tallo {
			fill: url(#degradadoTallo);
			stroke: #173e13;
			stroke-width: 3;
		}

		.hoja {
			fill: url(#degradadoHoja);
			stroke: #173e13;
			stroke-width: 3;
		}

		.papel { fill: url(#degradadoPapel); stroke: #d9c9af; stroke-width: 3; }
		.papel-oro { fill: #d99538; opacity: .9; }

		@keyframes respirar {
			0%, 100% { opacity: 1; }
			50% { opacity: .92; }
		}

		.flor > animateTransform {
			transform-box: fill-box;
		}

		.petalo-caida {
			fill: url(#degradadoPetalo);
			opacity: 0;
			transform-box: fill-box;
			transform-origin: center;
			animation: caerPetalo linear infinite;
		}

		@keyframes caerPetalo {
			0% { opacity: 0; transform: translateY(-80px) rotate(0deg); }
			10% { opacity: .85; }
			50% { opacity: .72; transform: translate(28px, 520px) rotate(190deg); }
			100% { opacity: 0; transform: translate(-22px, 1080px) rotate(420deg); }
		}

		@media (max-width: 600px) {
			.titulo { font-size: 55px; }
		}

		@media (prefers-reduced-motion: reduce) {
			.flor { animation: none; }
		}
	</style>
</head>
<body>
<main class="escena" aria-label="Ramo de siete girasoles para ti">
	<svg viewBox="0 0 900 1000" role="img" aria-labelledby="titulo descripcion">
		<title id="titulo">Para Ti - Te Amo</title>
		<desc id="descripcion">Ramo vectorial de siete girasoles amarillos sobre un fondo espacial morado.</desc>

		<defs>

				<stop offset="0" stop-color="#2b1244" />

				<stop offset="1" stop-color="#020207" />
			</linearGradient>
			<linearGradient id="degradadoPetalo" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="#ff8c00" />
				<stop offset=".52" stop-color="#ffd700" />
				<stop offset="1" stop-color="#ffff00" />
			</linearGradient>
			<radialGradient id="degradadoCentro" cx="35%" cy="30%">
				<stop offset="0" stop-color="#8e5b20" />
				<stop offset=".35" stop-color="#4c2810" />
				<stop offset="1" stop-color="#120803" />
			</radialGradient>
			<linearGradient id="degradadoTallo" x1="0" x2="1">
				<stop stop-color="#164d1b" />
				<stop offset=".5" stop-color="#66a92e" />
				<stop offset="1" stop-color="#1e5b1c" />
			</linearGradient>
			<linearGradient id="degradadoHoja" x1="0" y1="0" x2="1" y2="1">
				<stop stop-color="#83c83d" />
				<stop offset="1" stop-color="#194c19" />
			</linearGradient>
			<linearGradient id="degradadoPapel" x1="0" y1="0" x2="1" y2="1">
				<stop stop-color="#fffdf5" />
				<stop offset=".52" stop-color="#efe4d1" />
				<stop offset="1" stop-color="#fffaf0" />
			</linearGradient>
			<filter id="brillo" x="-30%" y="-30%" width="160%" height="160%">
				<feGaussianBlur stdDeviation="5" result="blur" />
				<feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
			</filter>
			<filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%">

				<use href="#petaloBase" transform="rotate(112.5)" />

				<use href="#petaloBase" transform="rotate(247.5)" />

				<use href="#petaloBase" transform="rotate(315)" />

			<ellipse id="petaloBase" class="petalo" cx="0" cy="-75" rx="24" ry="72" />
			<g id="semillas">
				<circle class="semilla" cx="-20" cy="-14" r="4" /><circle class="semilla" cx="5" cy="-20" r="3" />
				<circle class="semilla" cx="22" cy="-4" r="4" /><circle class="semilla" cx="-5" cy="4" r="3" />
				<circle class="semilla" cx="-24" cy="14" r="3" /><circle class="semilla" cx="12" cy="18" r="4" />
				<circle class="semilla" cx="0" cy="25" r="3" />
			</g>
		</defs>

		<rect width="900" height="1000" fill="url(#fondo)" />
		<g opacity=".9">
			<circle class="estrella" cx="78" cy="130" r="3" /><circle class="estrella" cx="180" cy="82" r="2" />
			<circle class="estrella" cx="760" cy="115" r="3" /><circle class="estrella" cx="830" cy="270" r="2" />

			<circle class="estrella" cx="805" cy="570" r="3" /><circle class="estrella" cx="120" cy="675" r="2" />
		</g>

		</g>

			<ellipse class="petalo-caida" cx="145" cy="80" rx="8" ry="19" style="animation-duration: 12s; animation-delay: -9s" />
			<ellipse class="petalo-caida" cx="735" cy="170" rx="9" ry="21" style="animation-duration: 8.8s; animation-delay: -1s" />

			<ellipse class="petalo-caida" cx="55" cy="500" rx="9" ry="21" style="animation-duration: 10.2s; animation-delay: -8s" />
			<ellipse class="petalo-caida" cx="210" cy="570" rx="8" ry="19" style="animation-duration: 9.4s; animation-delay: -3s" />
			<ellipse class="petalo-caida" cx="300" cy="690" rx="10" ry="23" style="animation-duration: 11s; animation-delay: -10s" />
			<ellipse class="petalo-caida" cx="600" cy="620" rx="8" ry="20" style="animation-duration: 8.4s; animation-delay: -1s" />
			<ellipse class="petalo-caida" cx="745" cy="540" rx="10" ry="23" style="animation-duration: 10s; animation-delay: -6s" />
			<ellipse class="petalo-caida" cx="850" cy="700" rx="8" ry="19" style="animation-duration: 9s; animation-delay: -2s" />
			<ellipse class="petalo-caida" cx="105" cy="770" rx="10" ry="22" style="animation-duration: 11.5s; animation-delay: -7s" />

			<ellipse class="petalo-caida" cx="820" cy="900" rx="10" ry="23" style="animation-duration: 10.6s; animation-delay: -9s" />
		</g>

		<text class="titulo" x="500" y="97" text-anchor="middle">CHI AMU mi niña 🌻</text>
